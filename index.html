<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juggles — Ten cinematic directions</title><meta name="description" content="Ten cinematic exploded-view smart football concepts. Choose your hero image."><style>
*{box-sizing:border-box}body{margin:0;background:#080a0d;color:#f8f8f8;font:14px system-ui,sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}header{display:flex;justify-content:space-between;align-items:center;padding:20px 4vw;border-bottom:1px solid #ffffff20}.brand{font-size:22px;font-weight:800;letter-spacing:-1px}header span{font-size:12px;color:#a9b0ba}main{max-width:1800px;margin:auto;padding:24px 4vw}.hero{position:relative;background:#12151a;border-radius:14px;overflow:hidden;aspect-ratio:16/9}.hero img{width:100%;height:100%;object-fit:contain;display:block}.hero button{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;background:#080a0ddd;color:white;border:1px solid #ffffff60;border-radius:50%;font-size:24px}.prev{left:16px}.next{right:16px}.info{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:22px 0}.info h1{font-size:22px;margin:0 0 7px;letter-spacing:-.5px}.info p{font-size:12px;color:#a9b0ba;margin:0}.info a{color:white;border:1px solid #ffffff50;border-radius:30px;padding:12px 20px;text-decoration:none;white-space:nowrap}.choices{display:grid;grid-template-columns:repeat(10,1fr);gap:10px;padding-bottom:20px}.choice{padding:0;background:#11151b;color:#c9ced5;text-align:left;border:2px solid transparent;border-radius:8px;overflow:hidden}.choice[aria-pressed=true]{border-color:#a6f56d;color:white}.choice img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.choice span{font-size:10px;display:block;padding:9px 7px;line-height:1.4}button:focus-visible,a:focus-visible{outline:3px solid #a6f56d;outline-offset:4px}.note{font-size:11px;color:#8f98a5;line-height:1.7;margin:12px 0 25px}.loading{position:absolute;inset:0;display:grid;place-content:center;color:#a9b0ba;pointer-events:none}.hero img{position:relative}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:1000px){.choices{grid-template-columns:repeat(5,1fr)}}@media(max-width:600px){header{padding:17px 5vw}header span{font-size:10px}main{padding:20px 5vw}.hero{aspect-ratio:4/3;border-radius:9px}.hero button{width:40px;height:40px}.prev{left:8px}.next{right:8px}.info{align-items:flex-start}.info h1{font-size:18px}.info a{font-size:11px;padding:10px 14px}.choices{grid-template-columns:repeat(2,1fr);gap:12px}.choice span{font-size:12px}.note{font-size:11px}}
header nav{display:flex;gap:.6rem 1.5rem;flex-wrap:wrap}header nav a{font:600 15px system-ui;color:#f4f4f0;text-decoration:none}header nav a[aria-current]{color:#c8f568}header nav a:hover{text-decoration:underline}@media(max-width:700px){header{align-items:flex-start;flex-direction:column;gap:.9rem}header nav{gap:.5rem .9rem}header nav a{font-size:14px}}</style></head><body><header><a class="brand" href="./" style="color:inherit;text-decoration:none">juggles.</a><nav aria-label="Project navigation"><a href="./" aria-current="page">Concepts</a><a href="./parts/">NZ prices</a><a href="./gallery/">Parts gallery</a><a href="./tutorial/">Build tutorial</a><a href="./research/">Research</a></nav></header><main><div class="hero"><span class="loading">Loading image…</span><img id="hero" src="assets/01.png" alt="Exploded smart football concept with impact sensors"><button class="prev" aria-label="Previous image">‹</button><button class="next" aria-label="Next image">›</button></div><div class="info"><div aria-live="polite"><h1 id="title"></h1><p id="subtitle"></p></div><a id="download" href="assets/01.png" download>Download image ↗</a></div><div class="choices" aria-label="Choose an image"></div><p class="note">AI-generated visual concepts inspired by cinematic treatments. Imagined impact-sensing technology. Director names describe creative references. Image artwork contains no text or people.</p></main><script>
const directions=[['Christopher Nolan','Steel blue · impact energy'],['Denis Villeneuve','Ochre haze · monumental minimalism'],['Wes Anderson','Pastels · precise symmetry'],['Ridley Scott','Industrial noir · volumetric light'],['Stanley Kubrick','Space-age white · red core'],['Wong Kar-wai','Jade & red · nocturnal atmosphere'],['Steven Spielberg','Warm backlight · cinematic wonder'],['Guillermo del Toro','Teal & gold · mechanical intricacy'],['David Fincher','Graphite · forensic precision'],['George Miller','Burnt orange · kinetic spectacle']];
const choices=document.querySelector('.choices');let current=0;
directions.forEach(([name],index)=>{const button=document.createElement('button');button.className='choice';button.setAttribute('aria-label',`Choose image ${index+1}, ${name} inspired`);button.innerHTML=`<img src="assets/${String(index+1).padStart(2,'0')}.png" alt="" loading="lazy"><span>${String(index+1).padStart(2,'0')} / ${name}</span>`;button.addEventListener('click',()=>select(index));choices.append(button)});
function select(index){current=(index+directions.length)%directions.length;const [name,description]=directions[current];const src=`assets/${String(current+1).padStart(2,'0')}.png`;document.querySelector('#hero').src=src;document.querySelector('#hero').alt=`${name}-inspired exploded soccer ball showing its layered shell and internal impact sensor technology. ${description}.`;document.querySelector('#title').textContent=`${String(current+1).padStart(2,'0')} / ${name}`;document.querySelector('#subtitle').textContent=description;document.querySelector('#download').href=src;document.querySelectorAll('.choice').forEach((button,i)=>button.setAttribute('aria-pressed',String(i===current)));history.replaceState(null,'',`#${current+1}`)}
document.querySelector('.prev').addEventListener('click',()=>select(current-1));document.querySelector('.next').addEventListener('click',()=>select(current+1));document.addEventListener('keydown',event=>{if(event.key==='ArrowLeft')select(current-1);if(event.key==='ArrowRight')select(current+1)});const initial=Number(location.hash.slice(1));select(Number.isInteger(initial)&&initial>=1&&initial<=10?initial-1:0);
</script></body></html>
